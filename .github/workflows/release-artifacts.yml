name: Build and Upload Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. CHMER5)"
        required: true
        default: "CHMER5"

permissions:
  contents: write

jobs:
  build-unix:
    name: Build ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: chmer-linux-x86_64.tar.gz
            exe_name: chmer
            build_tool: cargo
          - slug: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: chmer-linux-aarch64.tar.gz
            exe_name: chmer
            build_tool: zigbuild
          - slug: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            archive: chmer-macos-aarch64.tar.gz
            exe_name: chmer
            build_tool: cargo
          - slug: macos-x86_64
            runner: macos-14
            target: x86_64-apple-darwin
            archive: chmer-macos-x86_64.tar.gz
            exe_name: chmer
            build_tool: cargo
          - slug: freebsd-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            archive: chmer-freebsd-x86_64.tar.gz
            exe_name: chmer
            build_tool: zigbuild
          - slug: freebsd-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-freebsd
            archive: chmer-freebsd-aarch64.tar.gz
            exe_name: chmer
            build_tool: zigbuild
          - slug: openbsd-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-openbsd
            archive: chmer-openbsd-x86_64.tar.gz
            exe_name: chmer
            build_tool: zigbuild
          - slug: netbsd-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-netbsd
            archive: chmer-netbsd-x86_64.tar.gz
            exe_name: chmer
            build_tool: zigbuild

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.build_tool == 'cargo'
        with:
          targets: ${{ matrix.target }}

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.build_tool == 'zigbuild'

      - name: Setup Zig
        if: runner.os == 'Linux' && matrix.build_tool == 'zigbuild'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux' && matrix.build_tool == 'zigbuild'
        run: cargo install cargo-zigbuild

      - name: Build (cargo)
        if: matrix.build_tool == 'cargo'
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Build (cargo-zigbuild)
        if: runner.os == 'Linux' && matrix.build_tool == 'zigbuild'
        run: cargo zigbuild --release --target "${{ matrix.target }}"

      - name: Verify binary exists
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f "target/${{ matrix.target }}/release/${{ matrix.exe_name }}"

      - name: Verify binary exists (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -f "target/${{ matrix.target }}/release/${{ matrix.exe_name }}"

      - name: Build (macOS compatibility no-op)
        if: runner.os == 'macOS' && matrix.build_tool != 'cargo'
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pkg/bin
          cp "target/${{ matrix.target }}/release/${{ matrix.exe_name }}" "out/pkg/bin/${{ matrix.exe_name }}"
          cp README.md out/pkg/README.md
          cp LICENSE out/pkg/LICENSE
          cp -R examples out/pkg/examples
          tar -czf "out/${{ matrix.archive }}" -C out/pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: out/${{ matrix.archive }}

  build-windows:
    name: Build ${{ matrix.slug }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: windows-x86_64
            target: x86_64-pc-windows-msvc
            archive: chmer-windows-x86_64.zip
          - slug: windows-aarch64
            target: aarch64-pc-windows-msvc
            archive: chmer-windows-aarch64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: pwsh
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out\pkg\bin | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\chmer.exe" "out\pkg\bin\chmer.exe" -Force
          Copy-Item README.md out\pkg\README.md -Force
          Copy-Item LICENSE out\pkg\LICENSE -Force
          Copy-Item install.bat out\pkg\install.bat -Force
          Copy-Item uninstall.bat out\pkg\uninstall.bat -Force
          if (Test-Path chmer.png) { Copy-Item chmer.png out\pkg\chmer.png -Force }
          Compress-Archive -Path out\pkg\* -DestinationPath "out\${{ matrix.archive }}" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: out/${{ matrix.archive }}

  upload-release:
    name: Upload artifacts to release
    runs-on: ubuntu-latest
    needs: [build-unix, build-windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Flatten artifact files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp out/*/* release/
          cp chmer.png release/chmer.png
          mkdir -p asset-staging/images asset-staging/text asset-staging/emoji
          cp chmer.png asset-staging/images/chmer.png
          printf "Welcome to CHMER assets pack.\nYou can place custom images/text/emoji files in this bundle.\n" > asset-staging/text/welcome.txt
          printf "♔ ♕ ♖ ♗ ♘ ♙\n♚ ♛ ♜ ♝ ♞ ♟\n" > asset-staging/emoji/default.txt
          tar -czf release/chmer-assets.tar.gz -C asset-staging .
          (cd asset-staging && zip -rq ../release/chmer-assets.zip .)
          cp install.sh install.ps1 install.bat uninstall.bat LICENSE README.md release/
          (cd release && zip -rq installers.zip .)

      - name: Verify artifacts contain binaries
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            chmer-linux-x86_64.tar.gz \
            chmer-linux-aarch64.tar.gz \
            chmer-macos-aarch64.tar.gz \
            chmer-macos-x86_64.tar.gz \
            chmer-freebsd-x86_64.tar.gz \
            chmer-freebsd-aarch64.tar.gz \
            chmer-openbsd-x86_64.tar.gz \
            chmer-netbsd-x86_64.tar.gz
          do
            tar -tzf "release/$f" | rg -q '(^|/)chmer$'
          done
          for f in chmer-windows-x86_64.zip chmer-windows-aarch64.zip; do
            unzip -l "release/$f" | awk '{print $4}' | rg -q '(^|/)chmer\.exe$'
            unzip -l "release/$f" | awk '{print $4}' | rg -q '(^|/)install\.bat$'
            unzip -l "release/$f" | awk '{print $4}' | rg -q '(^|/)uninstall\.bat$'
          done

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.inputs.tag }}" release/* --clobber
