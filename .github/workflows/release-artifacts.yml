name: Build and Upload Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. CHMER5)"
        required: true
        default: "CHMER5"

permissions:
  contents: write

jobs:
  build-unix:
    name: Build ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: chmer-linux-x86_64.tar.gz
            exe_name: chmer
            build_tool: cargo
          - slug: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: chmer-linux-aarch64.tar.gz
            exe_name: chmer
            build_tool: cargo
          - slug: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            archive: chmer-macos-aarch64.tar.gz
            exe_name: chmer
            build_tool: cargo
          - slug: macos-x86_64
            runner: macos-14
            target: x86_64-apple-darwin
            archive: chmer-macos-x86_64.tar.gz
            exe_name: chmer
            build_tool: cargo

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.build_tool == 'cargo'
        with:
          targets: ${{ matrix.target }}

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.build_tool == 'zigbuild'

      - name: Build (cargo)
        if: matrix.build_tool == 'cargo'
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Verify binary exists
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f "target/${{ matrix.target }}/release/${{ matrix.exe_name }}"

      - name: Verify binary exists (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -f "target/${{ matrix.target }}/release/${{ matrix.exe_name }}"

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pkg/bin
          cp "target/${{ matrix.target }}/release/${{ matrix.exe_name }}" "out/pkg/bin/${{ matrix.exe_name }}"
          cp README.md out/pkg/README.md
          cp LICENSE out/pkg/LICENSE
          cp -R examples out/pkg/examples
          tar -czf "out/${{ matrix.archive }}" -C out/pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: out/${{ matrix.archive }}

  build-bsd:
    name: Build ${{ matrix.slug }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: freebsd-x86_64
            os: freebsd
            version: "14.1"
            architecture: x86_64
            archive: chmer-freebsd-x86_64.tar.gz
          - slug: freebsd-aarch64
            os: freebsd
            version: "14.1"
            architecture: x86_64
            archive: chmer-freebsd-aarch64.tar.gz
          - slug: openbsd-x86_64
            os: openbsd
            version: "7.5"
            architecture: x86_64
            archive: chmer-openbsd-x86_64.tar.gz
          - slug: netbsd-x86_64
            os: netbsd
            version: "10.0"
            architecture: x86_64
            archive: chmer-netbsd-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Build in BSD VM
        uses: cross-platform-actions/action@v0.25.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: ${{ matrix.architecture }}
          shell: sh
          environment_variables: GITHUB_WORKSPACE
          run: |
            set -eu
            case "${{ matrix.os }}" in
              freebsd) sudo pkg install -y rust ;;
              openbsd)
                sudo pkg_add curl
                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
                export PATH="$HOME/.cargo/bin:$PATH"
                ;;
              netbsd) sudo pkgin -y install rust ;;
            esac
            cd "$GITHUB_WORKSPACE"
            if [ "${{ matrix.os }}" = "openbsd" ]; then
              export PATH="$HOME/.cargo/bin:$PATH"
            fi
            cargo build --release
            mkdir -p out/pkg/bin
            cp target/release/chmer out/pkg/bin/chmer
            cp README.md out/pkg/README.md
            cp LICENSE out/pkg/LICENSE
            cp -R examples out/pkg/examples
            tar -czf "out/${{ matrix.archive }}" -C out/pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: out/${{ matrix.archive }}

  build-freebsd-aarch64-cross:
    name: Build freebsd-aarch64 via cross
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        run: cross build --release --target aarch64-unknown-freebsd
      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pkg/bin
          cp target/aarch64-unknown-freebsd/release/chmer out/pkg/bin/chmer
          cp README.md out/pkg/README.md
          cp LICENSE out/pkg/LICENSE
          cp -R examples out/pkg/examples
          tar -czf out/chmer-freebsd-aarch64.tar.gz -C out/pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: chmer-freebsd-aarch64.tar.gz
          path: out/chmer-freebsd-aarch64.tar.gz

  build-windows:
    name: Build ${{ matrix.slug }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: windows-x86_64
            target: x86_64-pc-windows-msvc
            archive: chmer-windows-x86_64.zip
          - slug: windows-aarch64
            target: aarch64-pc-windows-msvc
            archive: chmer-windows-aarch64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: pwsh
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out\pkg\bin | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\chmer.exe" "out\pkg\bin\chmer.exe" -Force
          Copy-Item README.md out\pkg\README.md -Force
          Copy-Item LICENSE out\pkg\LICENSE -Force
          Copy-Item install.bat out\pkg\install.bat -Force
          Copy-Item uninstall.bat out\pkg\uninstall.bat -Force
          if (Test-Path chmer.png) { Copy-Item chmer.png out\pkg\chmer.png -Force }
          Compress-Archive -Path out\pkg\* -DestinationPath "out\${{ matrix.archive }}" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: out/${{ matrix.archive }}

  upload-release:
    name: Upload artifacts to release
    runs-on: ubuntu-latest
    needs: [build-unix, build-bsd, build-freebsd-aarch64-cross, build-windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Flatten artifact files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp out/*/* release/
          cp chmer.png release/chmer.png
          mkdir -p asset-staging/images asset-staging/text asset-staging/emoji
          cp chmer.png asset-staging/images/chmer.png
          printf "Welcome to CHMER assets pack.\nYou can place custom images/text/emoji files in this bundle.\n" > asset-staging/text/welcome.txt
          printf "♔ ♕ ♖ ♗ ♘ ♙\n♚ ♛ ♜ ♝ ♞ ♟\n" > asset-staging/emoji/default.txt
          tar -czf release/chmer-assets.tar.gz -C asset-staging .
          (cd asset-staging && zip -rq ../release/chmer-assets.zip .)
          cp install.sh install.ps1 install.bat uninstall.bat LICENSE README.md release/
          (cd release && zip -rq installers.zip .)

      - name: Verify artifacts contain binaries
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            chmer-linux-x86_64.tar.gz \
            chmer-linux-aarch64.tar.gz \
            chmer-macos-aarch64.tar.gz \
            chmer-macos-x86_64.tar.gz \
            chmer-freebsd-x86_64.tar.gz \
            chmer-freebsd-aarch64.tar.gz \
            chmer-openbsd-x86_64.tar.gz \
            chmer-netbsd-x86_64.tar.gz
          do
            tar -tzf "release/$f" | rg -q '(^|/)chmer$'
          done
          for f in chmer-windows-x86_64.zip chmer-windows-aarch64.zip; do
            unzip -l "release/$f" | awk '{print $4}' | rg -q '(^|/)chmer\.exe$'
            unzip -l "release/$f" | awk '{print $4}' | rg -q '(^|/)install\.bat$'
            unzip -l "release/$f" | awk '{print $4}' | rg -q '(^|/)uninstall\.bat$'
          done

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.inputs.tag }}" release/* --clobber
