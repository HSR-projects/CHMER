[workspace]
resolver = "2"
members = [
  "chmer5",
  "chmer5_compiler",
  "chmer5_vm",
  "chmer5_std",
  "chmer5_chess",
  "chmer5_inet",
  "chmer5_sys",
  "chmer5_fonts",
]

[workspace.package]
version = "5.0.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = "2"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
